name: DC Res Patch Depth Fix

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  get-info:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  windows:
    runs-on: windows-latest
    needs: get-info
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: build
        run: |
          set -e
          windres app.rc app.res.o
          gcc -O2 -std=gnu99 -Wall -Wextra -Werror -DDCFIX_NO_MAIN \
            -o "DC Res Patch Depth Fix.exe" dcdepthfix.c dcgui.c evofs.c app.res.o \
            -mwindows -lcomctl32 -lcomdlg32 -lole32 -lshell32 -static -s
          gcc -O2 -std=gnu99 -Wall -Wextra -Werror \
            -o "DC Res Patch Depth Fix (console).exe" dcdepthfix.c evofs.c app.res.o \
            -static -s

      - name: check
        run: |
          set -e
          mkdir -p empty
          "./DC Res Patch Depth Fix (console).exe" empty | tee out.txt
          grep -q "NOTHING TO PATCH" out.txt

      - name: package
        run: |
          mkdir upload
          mv "DC Res Patch Depth Fix.exe" upload
          mv "DC Res Patch Depth Fix (console).exe" upload
          cp check_depth_fix.py README.md upload

      - uses: actions/upload-artifact@v4
        with:
          name: dcfix-windows-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
          path: upload/

  linux:
    runs-on: ubuntu-latest
    needs: get-info
    steps:
      - uses: actions/checkout@v4

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config xvfb

      - name: build
        run: |
          set -e
          cc -O2 -std=gnu99 -Wall -Wextra -Werror -DDCFIX_NO_MAIN \
            -o DC-Res-Patch-Depth-Fix dcgtk.c dcdepthfix.c evofs.c \
            $(pkg-config --cflags --libs gtk+-3.0) -lm
          cc -O2 -std=gnu99 -Wall -Wextra -Werror \
            -o DC-Res-Patch-Depth-Fix-terminal dcdepthfix.c evofs.c -lm

      - name: analyzer
        run: cc -O1 -std=gnu99 -fanalyzer -c dcdepthfix.c evofs.c

      - name: check
        run: |
          set -e
          mkdir -p empty
          ./DC-Res-Patch-Depth-Fix-terminal empty | tee out.txt
          grep -q "NOTHING TO PATCH" out.txt

      - name: the window opens
        run: |
          set -e
          timeout 20 xvfb-run -a ./DC-Res-Patch-Depth-Fix &
          sleep 8
          pgrep -f DC-Res-Patch-Depth-Fix > /dev/null
          pkill -f DC-Res-Patch-Depth-Fix || true

      - name: package
        run: |
          mkdir upload
          mv DC-Res-Patch-Depth-Fix DC-Res-Patch-Depth-Fix-terminal upload
          cp packaging/linux/INSTALL.sh packaging/linux/dc-res-patch-depth-fix.desktop upload
          cp check_depth_fix.py upload
          cp README.md upload

      - uses: actions/upload-artifact@v4
        with:
          name: dcfix-linux-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
          path: upload/

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: get-info
    steps:
      - uses: actions/checkout@v4

      - name: dependencies
        run: brew install gtk+3 pkg-config

      - name: build
        run: |
          set -e
          cc -O2 -std=gnu99 -Wall -Wextra -DDCFIX_NO_MAIN \
            -o DC-Res-Patch-Depth-Fix dcgtk.c dcdepthfix.c evofs.c \
            $(pkg-config --cflags --libs gtk+-3.0)
          cc -O2 -std=gnu99 -Wall -Wextra -Werror \
            -o DC-Res-Patch-Depth-Fix-terminal dcdepthfix.c evofs.c

      - name: check
        run: |
          set -e
          mkdir -p empty
          ./DC-Res-Patch-Depth-Fix-terminal empty | tee out.txt
          grep -q "NOTHING TO PATCH" out.txt

      - name: package
        run: |
          mkdir upload
          mv DC-Res-Patch-Depth-Fix DC-Res-Patch-Depth-Fix-terminal upload
          cp check_depth_fix.py README.md upload

      - uses: actions/upload-artifact@v4
        with:
          name: dcfix-macos-${{ matrix.arch }}-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
          path: upload/

  release:
    needs: [ windows, linux, macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all

      - name: zip each
        run: |
          set -e
          mkdir ship
          cd all
          for d in */; do
            (cd "$d" && zip -r "../../ship/${d%/}.zip" .)
          done
          ls -la ../ship

      - uses: softprops/action-gh-release@v2
        with:
          files: ship/*
          generate_release_notes: true
