name: DC Res Patch Depth Fix

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: build
        run: |
          set -e
          windres app.rc app.res.o
          gcc -O2 -std=gnu99 -Wall -Wextra -Werror -DDCFIX_NO_MAIN \
            -o "DC Res Patch Depth Fix.exe" \
            dcdepthfix.c dcgui.c evofs.c app.res.o \
            -mwindows -lcomctl32 -lcomdlg32 -lole32 -lshell32 -static -s
          gcc -O2 -std=gnu99 -Wall -Wextra -Werror \
            -o "DC Res Patch Depth Fix (console).exe" \
            dcdepthfix.c evofs.c app.res.o -static -s

      - name: it starts and says the right thing
        run: |
          set -e
          mkdir -p empty
          out=$("./DC Res Patch Depth Fix (console).exe" empty || true)
          echo "$out"
          echo "$out" | grep -q "NOTHING TO PATCH" || { echo "wrong answer"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            DC Res Patch Depth Fix.exe
            DC Res Patch Depth Fix (console).exe
            check_depth_fix.py

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: what it needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config xvfb

      - name: build
        run: |
          set -e
          cc -O2 -std=gnu99 -Wall -Wextra -Werror -DDCFIX_NO_MAIN \
            -o DC-Res-Patch-Depth-Fix \
            dcgtk.c dcdepthfix.c evofs.c $(pkg-config --cflags --libs gtk+-3.0) -lm
          cc -O2 -std=gnu99 -Wall -Wextra -Werror \
            -o DC-Res-Patch-Depth-Fix-terminal dcdepthfix.c evofs.c -lm

      - name: the analyzer, which finds what the ordinary build does not
        run: cc -O1 -std=gnu99 -fanalyzer -c dcdepthfix.c evofs.c

      - name: it says the right thing
        run: |
          set -e
          mkdir -p empty
          out=$(./DC-Res-Patch-Depth-Fix-terminal empty || true)
          echo "$out"
          echo "$out" | grep -q "NOTHING TO PATCH" || { echo "wrong answer"; exit 1; }

      - name: the window opens
        run: |
          set -e
          timeout 20 xvfb-run -a ./DC-Res-Patch-Depth-Fix &
          sleep 8
          pgrep -f DC-Res-Patch-Depth-Fix > /dev/null || { echo "it did not stay up"; exit 1; }
          pkill -f DC-Res-Patch-Depth-Fix || true

      - name: wrap it up
        run: |
          set -e
          mkdir -p out/linux
          cp DC-Res-Patch-Depth-Fix DC-Res-Patch-Depth-Fix-terminal out/linux/
          cp packaging/linux/INSTALL.sh \
             packaging/linux/dc-res-patch-depth-fix.desktop out/linux/
          cp README.md out/linux/README.txt
          chmod +x out/linux/DC-Res-Patch-Depth-Fix \
                   out/linux/DC-Res-Patch-Depth-Fix-terminal \
                   out/linux/INSTALL.sh
          tar czf DC-Res-Patch-Depth-Fix-linux.tar.gz -C out linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: DC-Res-Patch-Depth-Fix-linux.tar.gz

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # apple silicon
            arch: arm64
          - runner: macos-13      # intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: what it needs
        run: brew install gtk+3 pkg-config

      - name: build
        run: |
          set -e
          cc -O2 -std=gnu99 -Wall -Wextra -DDCFIX_NO_MAIN \
            -o dcfix-gui dcgtk.c dcdepthfix.c evofs.c \
            $(pkg-config --cflags --libs gtk+-3.0)
          cc -O2 -std=gnu99 -Wall -Wextra -Werror \
            -o DC-Res-Patch-Depth-Fix-terminal dcdepthfix.c evofs.c

      - name: it says the right thing
        run: |
          set -e
          mkdir -p empty
          out=$(./DC-Res-Patch-Depth-Fix-terminal empty || true)
          echo "$out"
          echo "$out" | grep -q "NOTHING TO PATCH" || { echo "wrong answer"; exit 1; }

      - name: make it an app
        run: |
          set -e
          APP="DC Res Patch Depth Fix.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dcfix-gui "$APP/Contents/MacOS/"
          cp packaging/macos/Info.plist "$APP/Contents/"
          if [ -f packaging/macos/icon.icns ]; then
            cp packaging/macos/icon.icns "$APP/Contents/Resources/"
          fi
          mkdir -p out
          cp -R "$APP" out/
          cp DC-Res-Patch-Depth-Fix-terminal out/
          cp README.md out/README.txt
          tar czf DC-Res-Patch-Depth-Fix-macos-${{ matrix.arch }}.tar.gz -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: DC-Res-Patch-Depth-Fix-macos-${{ matrix.arch }}.tar.gz

  release:
    needs: [ windows, linux, macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all

      - name: one folder, everything in it
        run: |
          set -e
          mkdir -p ship
          cd all
          for d in */; do
            name="${d%/}"
            if compgen -G "$d"'*.tar.gz' > /dev/null; then
              cp "$d"*.tar.gz ../ship/
            else
              (cd "$d" && zip -r "../../ship/DC-Res-Patch-Depth-Fix-$name.zip" .)
            fi
          done
          ls -la ../ship

      - uses: softprops/action-gh-release@v2
        with:
          files: ship/*
          generate_release_notes: true
